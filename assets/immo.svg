  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#121a30"/></linearGradient>
    <linearGradient id="bord" x1="0" x2="1"><stop offset="0" stop-color="#db2777"/><stop offset="0.5" stop-color="#f9a8d4"/><stop offset="1" stop-color="#db2777"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151036"/>
    </linearGradient>
    <filter id="flou" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="lueur"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="titre" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="carte"><rect width="1200" height="340" rx="24"/></clipPath>
  </defs>
  <style>
    .nom { font: 700 64px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -1px; opacity: 0; animation: monte 1s ease-out .2s forwards; }
    .salut { font: 500 20px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #a5b4fc; opacity: 0; animation: monte 1s ease-out forwards; }
    .role { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #67e8f9; }
    .lieu { font: 400 17px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #94a3b8; opacity: 0; animation: monte 1s ease-out .6s forwards; }
    .noeud { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .lien { stroke-dasharray: 6 8; animation: defile 2s linear infinite; }
    @keyframes monte { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.6); opacity: .4; } }
    @keyframes defile { to { stroke-dashoffset: -28; } }
  </style>
  <g clip-path="url(#carte)">
    <rect width="1200" height="340" fill="url(#fond)"/>
    <g filter="url(#flou)">
      <circle r="170" fill="#7c3aed" fill-opacity="0.55"><animateMotion dur="18s" repeatCount="indefinite" path="M820 60 C 1000 120, 1050 280, 860 300 S 700 120, 820 60Z"/></circle>
      <circle r="150" fill="#06b6d4" fill-opacity="0.45"><animateMotion dur="22s" repeatCount="indefinite" path="M1050 260 C 900 330, 700 220, 800 120 S 1150 120, 1050 260Z"/></circle>
      <circle r="120" fill="#db2777" fill-opacity="0.25"><animateMotion dur="26s" repeatCount="indefinite" path="M300 320 C 500 260, 600 380, 450 380 S 150 360, 300 320Z"/></circle>
    </g>
    <rect width="1200" height="340" fill="url(#grille)"/>

    <g stroke="#67e8f9" stroke-opacity="0.45" stroke-width="1.5" fill="none">
      <path class="lien" d="M820 90 L930 150 L1060 110 L1110 220 L960 260 L840 220 Z"/>
      <path class="lien" d="M930 150 L960 260 M930 150 L840 220 M1060 110 L960 260"/>
    </g>
    <g fill="#e0f2fe" filter="url(#lueur)">
      <circle class="noeud" cx="820" cy="90" r="5"/>
      <circle class="noeud" cx="930" cy="150" r="7" style="animation-delay:.5s"/>
      <circle class="noeud" cx="1060" cy="110" r="5" style="animation-delay:1s"/>
      <circle class="noeud" cx="1110" cy="220" r="6" style="animation-delay:1.5s"/>
      <circle class="noeud" cx="960" cy="260" r="5" style="animation-delay:2s"/>
      <circle class="noeud" cx="840" cy="220" r="6" style="animation-delay:2.5s"/>
    </g>
    <circle r="5" fill="#f0abfc" filter="url(#lueur)"><animateMotion dur="7s" repeatCount="indefinite" path="M820 90 L930 150 L1060 110 L1110 220 L960 260 L840 220 Z"/></circle>

    <text class="salut" x="80" y="104">Bonjour, je suis</text>
    <text class="nom" x="78" y="170" fill="url(#titre)">Saliou Bailo Bah</text>
    <g class="role">
      <text x="80" y="228" opacity="0">Développeur Full Stack<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.04;0.29;0.33;1" values="0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.04;0.29;0.33;1" values="0 10;0 0;0 0;0 -10;0 -10"/></text>
      <text x="80" y="228" opacity="0">Angular · NestJS · Vue 3 · Java<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.333;0.373;0.623;0.663;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.333;0.373;0.623;0.663;1" values="0 10;0 10;0 0;0 0;0 -10;0 -10"/></text>
      <text x="80" y="228" opacity="0">Disponible pour un CDI<animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.667;0.707;0.957;0.997;1" values="0;0;1;1;0;0"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" keyTimes="0;0.667;0.707;0.957;0.997;1" values="0 10;0 10;0 0;0 0;0 -10;0 -10"/></text>
    </g>
    <text class="lieu" x="80" y="280">Toulouse, France  ·  Master Sciences du Logiciel</text>
  </g>
</svg>
